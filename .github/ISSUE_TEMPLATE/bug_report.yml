name: Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide sufficient details to help reproduce and resolve the problem.
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Go to '/generator'
        2. Select QR type '...'
        3. Enter input '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
      placeholder: The QR code should encode...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and device where the issue occurred.
      placeholder: Chrome 132 on Windows 11 / Safari on iOS 18
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or logs if applicable.
